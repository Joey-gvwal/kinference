name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  lint:
    runs-on: ubuntu-24.04
    # A cold cache compiles the dynamo monorepo git dep.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # The `zmq` crate compiles a bundled libzmq; protoc is vendored.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++
      # Installs what rust-toolchain.toml pins, components included.
      - run: rustup toolchain install
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just lint

  # Installs both charts on kind against a CPU dummy-weights vLLM and checks
  # discovery, KV ingest and CRD status. The image build is cold here (the
  # BuildKit cache mounts don't persist), hence the wide timeout.
  test-smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          install_only: true
      - run: just up
      - run: just test-smoke
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          # Events and describe show e.g. a Pending pod's FailedScheduling.
          kubectl get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl describe pods -l app.kubernetes.io/name=kinference || true
          kubectl describe pods -l mm/server-name=dummy-vllm || true
          kubectl get inferenceworkersets,inferencepools -A -o yaml || true
          kubectl logs deployment/kinference --tail=200 || true
          kubectl logs deployment/dummy-vllm --tail=50 || true
          kind export logs /tmp/kind-logs --name kinference-smoke || true
      - name: Upload kind logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kind-logs-${{ matrix.os }}
          path: /tmp/kind-logs
          retention-days: 3

  test-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++
      - run: rustup toolchain install
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just test-unit

  # Hands the head commit to the e2e suite, which lives in the repository
  # that the `E2E_REPO` variable names, and shows its verdict as the `e2e`
  # check run on that commit. The job checks nothing out and calls the API
  # as the App that owns the check run. The ruleset requires the check, so
  # a dispatch that fails blocks the merge on its own.
  dispatch-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: checks-token
        with:
          client-id: ${{ secrets.E2E_APP_CLIENT_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      # Queued until the suite adopts it, so the PR shows the check at once.
      - name: Create the check run
        id: check
        env:
          GH_TOKEN: ${{ steps.checks-token.outputs.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=e2e -f head_sha="$SHA" -f status=queued \
            -f details_url="$RUN_URL" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: dispatch-token
        with:
          client-id: ${{ secrets.E2E_APP_CLIENT_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          repositories: ${{ vars.E2E_REPO }}
          permission-contents: write
      - name: Dispatch the suite
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          E2E_REPO: ${{ vars.E2E_REPO }}
          CHECK_RUN_ID: ${{ steps.check.outputs.id }}
        run: |
          jq -n --arg sha "$SHA" --arg pr "$PR" --arg id "$CHECK_RUN_ID" --arg branch "$BRANCH" \
            '{event_type: "e2e", client_payload: {sha: $sha, pr: $pr, check_run_id: $id, branch: $branch}}' \
            | gh api "repos/$GITHUB_REPOSITORY_OWNER/$E2E_REPO/dispatches" --input -
      # A check run that stays queued would block the merge with no reason.
      - name: Fail the check run
        if: always() && steps.check.outputs.id != '' && steps.dispatch.outcome != 'success'
        env:
          GH_TOKEN: ${{ steps.checks-token.outputs.token }}
          CHECK_RUN_ID: ${{ steps.check.outputs.id }}
          CONCLUSION: ${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID" \
            -f status=completed -f conclusion="$CONCLUSION" \
            -f 'output[title]=the dispatch failed' \
            -f "output[summary]=[Run]($RUN_URL) did not dispatch the suite."

  ready-for-merge:
    name: Ready for merge
    needs:
      - lint
      - test-smoke
      - test-unit
    runs-on: ubuntu-24.04
    steps:
      - name: Ready for merge
        run: echo Ready for merge
