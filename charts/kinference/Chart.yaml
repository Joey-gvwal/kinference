apiVersion: v2
name: kinference
description: >-
  kinference — an LLM-aware monitor and endpoint picker. Watches a fleet of
  vLLM/SGLang workers (metrics, KV-cache events, served models) and answers
  Pick() with the endpoint predicted to serve a request fastest.
type: application
