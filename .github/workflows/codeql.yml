name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries run against unchanged code.
    - cron: '23 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Required on private repos to read the workflow run's metadata.
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{ matrix.language }}
