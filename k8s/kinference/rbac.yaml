# RBAC for kinference's KubeDiscovery.
#
# KubeDiscovery watches `EndpointSlice` resources for the named Service,
# nothing else. That requires get/list/watch on `endpointslices` in the
# `discovery.k8s.io` API group. No Pod permissions needed — all the
# per-pod data we use (UID, IP, node, zone, target ref) is exposed
# directly on the EndpointSlice's `endpoints[]`.
#
# By default this binding is cluster-wide so the monitor can watch
# EndpointSlices across all namespaces (config knob `discovery.namespace`
# is unset). If you want to scope the monitor to a single namespace,
# swap ClusterRole + ClusterRoleBinding for Role + RoleBinding in that
# namespace and set `discovery.namespace = "<that-ns>"` in the ConfigMap.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kinference
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kinference-endpointslice-watcher
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # InferenceWorkerSets are DISCOVERY, not policy: with [kubernetes] enabled
  # they define which pools exist at all. They belong in the base role for that
  # reason — gating them behind the policy role means a router with policy off
  # gets a Forbidden retry loop and serves nothing, with no obvious cause.
  # Writing their status stays policy-gated below.
  - apiGroups: ["kinference.buoyant.io"]
    resources: ["inferenceworkersets"]
    verbs: ["get", "list", "watch"]
  # Leader election (`[leader_election] enabled = true`), required before
  # scaling past one replica so that exactly one pod writes CRD status.
  #
  # `update` (not `patch`) because the elector writes with `replace`, carrying
  # the last-seen resourceVersion for optimistic concurrency — that is what
  # stops two replicas both winning a claim.
  #
  # Election fails CLOSED: without these verbs every replica stays a follower
  # and NO status is written, so `Accepted=True` never appears and a conforming
  # gateway never programs a route. Routing itself keeps working. Watch for
  # `kinference_leader` sitting at 0 on every pod with
  # `kinference_leader_election_errors_total` climbing.
  #
  # The Lease is namespaced, so a Role would be tighter than this ClusterRole;
  # it lives here only to match the existing binding shape.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # TokenReview, for `[token_review] enabled = true`. `create` only — the
  # resource is virtual and non-persisted, so creating one IS the read. This is
  # the standard grant for a delegated authenticator; the built-in
  # `system:auth-delegator` ClusterRole carries exactly this rule, and binding
  # that instead is equally valid.
  #
  # In the BASE role because token review is not routing policy: a deployment
  # may want it with `[policy]` switched off.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kinference-endpointslice-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kinference-endpointslice-watcher
subjects:
  - kind: ServiceAccount
    name: kinference
    namespace: default
---
# RBAC for CRD-driven routing policy (`[policy] enabled = true`).
#
# A SECOND ClusterRole rather than extra rules on the one above: that one is
# named for what it does (`endpointslice-watcher`) and is already bound, so
# widening it would leave the name lying. Skip applying this pair entirely if
# you never enable `[policy]`.
#
# kinference is the router-controller for these kinds, so it both reads them and
# writes their status:
#   - the three kinference.buoyant.io kinds: get/list/watch to resolve
#     pool -> policy -> workerSets, and status update/patch to publish
#     destinationCount, aggregated models, unresolvedDestinations, and the
#     Accepted / ResolvedRefs conditions.
#   - services: READ-ONLY, for the service-port number described inline below.
#   - httproutes: READ-ONLY, and only because `Accepted` lives inside
#     InferencePool `status.parents[]`, which is keyed by parent Gateway. There
#     is no way to know a pool's parents without reading the routes that name
#     it. kinference never writes HTTPRoute status — that belongs to the gateway
#     controller.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kinference-inference-policy
rules:
  # `inferenceworkersets` read access lives in the BASE role — see above.
  - apiGroups: ["kinference.buoyant.io"]
    resources: ["inferencepools", "inferencepolicies", "inferenceproviders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kinference.buoyant.io"]
    resources:
      - "inferencepools/status"
      - "inferencepolicies/status"
      - "inferenceworkersets/status"
      - "inferenceproviders/status"
    verbs: ["get", "update", "patch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
  # BackendBindings are the one place kinference writes an OBJECT rather than a
  # status subresource (`[policy] backend_bindings = true`, the default).
  - apiGroups: ["gateway.linkerd.io"]
    resources: ["backendbindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ReferenceGrant is how kinference decides whether one namespace may reference an
  # object in another — a pool's `destinations[].namespace`, and an
  # InferenceProvider's `backendRef.namespace`. The second is the one that
  # matters: it is what stops one namespace spending another's vendor
  # credential. kinference can enforce it WITHOUT reading the GatewayBackend, because
  # a grant lives in the target namespace and describes the reference rather
  # than the referent — which is also why the gateway cannot enforce it, since
  # it has no idea the InferenceProvider exists.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  #
  # WHAT IS DELIBERATELY ABSENT
  #
  # No `endpoints`, `pods` or `nodes`. Everything per-pod that routing needs
  # (UID, IP, node, zone, target ref) is on the EndpointSlice's `endpoints[]`,
  # and a serviceRef's port NAME resolves against the slice's own `ports[]` —
  # so the `services` rule above is needed ONLY for the service-port number a
  # BackendBinding must carry, and nothing in the pick path depends on it.
  #
  # No `secrets`, and nothing else in the core ("") apiGroup beyond read-only
  # Services. This is load-bearing rather than incidental: an off-cluster
  # destination's credentials live on a GatewayBackend, and kinference is designed
  # never to hold one. It names the backend by reference in the Pick response and
  # the CALLER resolves it, so a kinference compromise leaks no vendor credential —
  # there is none in its address space to leak.
  #
  # No `gatewaybackends` (gateway.linkerd.io) either, for the same reason: kinference
  # reads the InferenceProvider that points AT one, never the object itself. That
  # is why a dangling backendRef is invisible here and has to arrive as caller
  # feedback (Abort with BACKEND_UNRESOLVED / BACKEND_UNAUTHORIZED). The
  # backendbindings rule above is in the same API GROUP and does not change this:
  # a binding names a GatewayBackend, and naming one needs no access to it.
  #
  # RBAC is allowlist-only with no deny rules, so these absences ARE the
  # guarantee. Assert them rather than trusting them:
  #
  #   for r in secrets pods gatewaybackends.gateway.linkerd.io serviceaccounts/token; do
  #     kubectl auth can-i get "$r" --as=system:serviceaccount:default:kinference
  #   done   # every line must print: no
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kinference-inference-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kinference-inference-policy
subjects:
  - kind: ServiceAccount
    name: kinference
    namespace: default
