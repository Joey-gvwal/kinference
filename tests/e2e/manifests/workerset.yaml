# Worker set for the smoke test: discovers dummy-vllm (the real CPU engine
# from k8s/examples/dummy-vllm). kvBlockSize 128 matches vLLM's CPU-backend
# block size — a mismatch drops every published event before insertion.
apiVersion: kinference.buoyant.io/v1alpha1
kind: InferenceWorkerSet
metadata:
  name: dummy
  namespace: default
spec:
  profile: default
  kvBlockSize: 128
  serviceRef:
    name: dummy-vllm
    port: http
  kvEvents:
    port: kv-pub
  models:
    - {name: HuggingFaceTB/SmolLM2-135M-Instruct, aliases: [dummy]}
