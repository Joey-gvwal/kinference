apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferencepools.kinference.buoyant.io
  labels:
    app.kubernetes.io/part-of: kinference
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
spec:
  group: kinference.buoyant.io
  names:
    kind: InferencePool
    listKind: InferencePoolList
    plural: inferencepools
    singular: inferencepool
    shortNames: [infpool, infpools]
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Policy, type: string, jsonPath: ".spec.policyRef.name"}
    - {name: Destinations, type: integer, jsonPath: ".status.destinationCount"}
    - {name: State, type: string, jsonPath: ".status.state"}
    - {name: Age, type: date, jsonPath: ".metadata.creationTimestamp"}
    schema:
      openAPIV3Schema:
        description: |-
          A set of inference endpoints, optionally associated with a policy.
        type: object
        properties:
          apiVersion: {type: string}
          kind: {type: string}
          metadata: {type: object}
          spec:
            type: object
            properties:
              destinations:
                description: |-
                  List of InferenceWorkerSet and InferenceProviders in this
                  pool. If empty, includes every InferenceWorkerSet (but not
                  InferenceProvider) in this namespace.
                type: array
                maxItems: 64
                x-kubernetes-list-type: atomic
                items:
                  type: object
                  required: [kind]
                  properties:
                    group: {type: string, default: kinference.buoyant.io, maxLength: 253}
                    kind: {type: string, enum: [InferenceWorkerSet, InferenceProvider]}
                    name: {type: string, maxLength: 253}
                    namespace: {type: string, maxLength: 253}
                    selector:
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          maxProperties: 64
                          additionalProperties: {type: string}
                  x-kubernetes-validations:
                  - rule: "has(self.name) != has(self.selector)"
                    message: "exactly one of name or selector"
              policyRef:
                description: |-
                  An InferencePolicy determining how endpoints in this pool are
                  chosen. If unset, will do basic model routing: any endpoint
                  serving the model in the request (including aliases) will be
                  considered, and the one with the lowest expected TTFT will be
                  chosen.
                type: object
                required: [name]
                properties:
                  group: {type: string, default: kinference.buoyant.io, maxLength: 253}
                  kind: {type: string, default: InferencePolicy, maxLength: 253}
                  name: {type: string, maxLength: 253}
          status:
            type: object
            properties:
              state:
                type: string
                maxLength: 256
              destinationCount: {type: integer}
              models:
                type: array
                maxItems: 128
                x-kubernetes-list-type: atomic
                items:
                  type: object
                  properties:
                    name: {type: string, maxLength: 512}
                    servedBy:
                      type: array
                      maxItems: 64
                      items: {type: string, maxLength: 253}
                    contextWindow:
                      type: object
                      properties:
                        min: {type: integer}
                        max: {type: integer}
              unresolvedDestinations:
                type: array
                maxItems: 64
                x-kubernetes-list-type: atomic
                items:
                  type: object
                  properties:
                    kind: {type: string, maxLength: 253}
                    name: {type: string, maxLength: 253}
                    reason: {type: string, maxLength: 64}
              conditions:
                type: array
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [type]
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason, message]
                  properties:
                    type: {type: string, maxLength: 316}
                    status: {type: string, enum: ["True", "False", "Unknown"]}
                    observedGeneration: {type: integer, format: int64, minimum: 0}
                    lastTransitionTime: {type: string, format: date-time}
                    reason: {type: string, maxLength: 1024}
                    message: {type: string, maxLength: 32768}
              parents:
                type: array
                maxItems: 32
                x-kubernetes-list-type: atomic
                items:
                  type: object
                  required: [parentRef]
                  properties:
                    parentRef:
                      type: object
                      required: [name]
                      properties:
                        group: {type: string, default: gateway.networking.k8s.io, maxLength: 253}
                        kind: {type: string, default: Gateway, maxLength: 253}
                        name: {type: string, maxLength: 253}
                        namespace: {type: string, maxLength: 253}
                    controllerName:
                      type: string
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\/[A-Za-z0-9\/\-._~%!$&''()*+,;=:]+$'
                    conditions:
                      type: array
                      maxItems: 8
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [type]
                      items:
                        type: object
                        required: [type, status, lastTransitionTime, reason, message]
                        properties:
                          type: {type: string, maxLength: 316}
                          status: {type: string, enum: ["True", "False", "Unknown"]}
                          observedGeneration: {type: integer, format: int64, minimum: 0}
                          lastTransitionTime: {type: string, format: date-time}
                          reason: {type: string, maxLength: 1024}
                          message: {type: string, maxLength: 32768}
    subresources:
      status: {}
