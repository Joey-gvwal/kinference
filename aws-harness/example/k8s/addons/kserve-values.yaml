# KServe Helm values
# KServe manages InferenceService lifecycle, scaling, and routing.
# Chart: oci://ghcr.io/kserve/charts/kserve  (OCI, no helm repo add needed)
# Version: v0.16.0
#
# Install command (see scripts/install-addons.sh — CRDs must be installed first):
#   helm upgrade --install kserve-crd oci://ghcr.io/kserve/charts/kserve-crd --version v0.16.0 --namespace kserve --create-namespace
#   helm upgrade --install kserve oci://ghcr.io/kserve/charts/kserve \
#     --version v0.16.0 --namespace kserve --create-namespace \
#     -f k8s/addons/kserve-values.yaml

kserve:
  controller:
    # Deployment mode: "Standard" uses regular Kubernetes Deployments (no Knative).
    # "Knative" requires Knative Serving to be installed separately.
    # Valid values: "Standard", "Knative"
    deploymentMode: "Standard"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    gateway:
      # In Standard mode KServe creates a plain Kubernetes Ingress per service.
      # Set disableIngressCreation: true if you want to manage routing yourself
      # (e.g. via the llm-d gateway).
      disableIngressCreation: false
