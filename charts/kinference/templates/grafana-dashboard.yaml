{{- if .Values.grafanaDashboard.enabled }}
# Loaded by the kube-prometheus-stack Grafana sidecar, which needs
# `searchNamespace: ALL` to find it outside its own namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kinference.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  kinference-dashboard.json: |
    {{- .Files.Get "dashboards/kinference-dashboard.json" | nindent 4 }}
{{- end }}
