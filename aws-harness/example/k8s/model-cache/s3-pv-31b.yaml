# PersistentVolume backed by Mountpoint for Amazon S3 CSI driver.
#
# Provides read-only access to the Gemma 4 31B FP8 weights stored at:
#   s3://471112539178-us-west-2/weights/gemma-4-31b-fp8/
#
# Applied by: make -f Makefile.31b addons
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gemma-4-31b-weights
spec:
  capacity:
    storage: 35Gi          # informational only — S3 has no fixed capacity quota
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""     # static provisioning; bypass dynamic StorageClass
  csi:
    driver: s3.csi.aws.com
    volumeHandle: gemma-4-31b-weights-s3
    volumeAttributes:
      bucketName: "471112539178-us-west-2"
  mountOptions:
    - region=us-west-2
    - read-only
    - prefix=weights/gemma-4-31b-fp8/
    - allow-other
