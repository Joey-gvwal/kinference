# A value the schema's enum rejects. `kubectl apply` would refuse this one, but
# only after the round trip; `kinfctl check` says where, before.
apiVersion: kinference.buoyant.io/v1alpha1
kind: InferencePolicy
metadata: {name: bad-enum, namespace: default}
spec:
  rules:
  - name: r
    route:
      consider:
      - type: local
      select:
      - {minimize: PredictedTTFT}
