ollama:
  gpu:
    enabled: false
  models:
    pull:
      - mxbai-embed-large

# Pin to system nodes — keeps Ollama off the GPU node so it doesn't
# compete with the 31B vLLM pod for memory or scheduling priority.
nodeSelector:
  role: system

persistentVolume:
  enabled: true
  size: 50Gi
  storageClass: gp2
