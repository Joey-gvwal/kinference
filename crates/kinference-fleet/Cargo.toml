[package]
name = "kinference-fleet"
description = "Which workers exist and what state they are in: pools, discovery, the scrape of engine metrics, ZMQ ingest and the model index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Fixtures for other crates' tests: `pool::test_pool`, `pool::test_spec`,
# `gauges::test_stored_event`, `MetricsRegistry::record_sample_for_test`.
test-util = []

[dependencies]
kinference-policy.workspace = true
dynamo-kv-router.workspace = true
# `net` for `AsyncFd`, which wraps the ZMQ socket fd in `ingest`.
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-util.workspace = true
serde.workspace = true
zmq.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
dashmap.workspace = true
# `prometheus-parse` parses worker /metrics; `prometheus` is the exposition
# side, for the fleet's own families.
prometheus-parse.workspace = true
prometheus.workspace = true
async-trait.workspace = true

[dev-dependencies]
# `tokio::time::pause` and `advance`, for the gauges' dump-interval tests.
tokio = { workspace = true, features = ["test-util"] }
# `PoolId::from_raw`, for the model-index tests.
kinference-policy = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
