# llm-d-modelservice values — Gemma 4 31B Dense bf16 on g6e.12xlarge (4x L40S)
#
# Experimental config: full-precision 31B dense model with tensor parallelism.
# Uses all 4 L40S GPUs on a single g6e.12xlarge node (176 GB VRAM total).
# Better context utilization than the 26B MoE (all 31B params active per token).
#
# Project:   https://github.com/llm-d-incubation/llm-d-modelservice
# Helm repo: https://llm-d-incubation.github.io/llm-d-modelservice/
# Chart:     llm-d-modelservice/llm-d-modelservice (v0.4.9)
#
# Install (via make -f Makefile.31b inference):
#   helm upgrade --install gemma-4-31b llm-d-modelservice/llm-d-modelservice \
#     --namespace default -f k8s/addons/modelservice-values-31b.yaml \
#     --version v0.4.9 --wait --timeout 40m
#
# Prerequisites:
#   • make infra-31b        — g6e.12xlarge cluster (wm-inf-31b)
#   • make addons           — installs S3 CSI driver and gateway add-ons
#   • make init-weights-31b — downloads 31B weights to S3 (one-time ~60-90 min)

multinode: false

modelArtifacts:
  # name is the value of the "model" field in OpenAI API requests.
  # Kept as google/gemma-4-31B-it for API compatibility even though the
  # weights are the RedHatAI FP8-block quantized variant.
  name: "google/gemma-4-31B-it"
  # pvc:// URI mounts the named PVC at /model-cache; vLLM reads weights from there.
  # The PVC is backed by the Mountpoint for S3 CSI driver (ReadOnlyMany),
  # pointing to s3://471112539178-us-west-2/weights/gemma-4-31b-fp8/.
  uri: "pvc://gemma-4-31b-weights/"
  # FP8 weights on disk: ~31 GB. 35 Gi matches the PVC size.
  size: 35Gi
  # Labels added to all serving pods.
  # Must match inferencePool.modelServers.matchLabels in gaie-values-31b.yaml.
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: gemma-4-31b

routing:
  servicePort: 8000
  proxy:
    enabled: false
    targetPort: 8000

accelerator:
  type: nvidia

# ── Decode pods (vLLM inference servers) ──────────────────────────────────────
decode:
  create: true
  replicas: 1  # single pod consuming all 4 GPUs via tensor parallelism

  # Generous deadline: 31B bf16 cold start is slower than AWQ MoE.
  #   image pull  ~5-10 min
  #   CUDA init   ~5 min
  #   model load  ~5 min (62 GB across 4x NVLink)
  #   readiness   ~1 min
  progressDeadlineSeconds: 2400  # 40 min

  nodeSelector:
    role: gpu

  parallelism:
    tensor: 4   # 4 GPUs per pod — splits model across all L40S on g6e.12xlarge
    data: 1
    dataLocal: 1
    workers: 1

  containers:
    - name: "vllm"
      # vllm/vllm-openai:gemma4 bundles transformers>=5.5.0 required for Gemma 4.
      # Does not emit ZeroMQ KV-cache events; EPP routes by KV utilization + queue depth.
      image: "vllm/vllm-openai:gemma4"
      modelCommand: vllmServe
      imagePullPolicy: IfNotPresent
      env:
        - name: HOME
          value: /tmp
        - name: FLASHINFER_WORKSPACE_DIR
          value: /tmp/flashinfer
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      args:
        # 0.90 utilization on 4x L40S (192 GB total).
        # FP8 weights ~31 GB → ~35 GB/GPU free for KV cache on L40S (48 GB).
        # L40S (Ada Lovelace) has native FP8 tensor cores — faster than bf16.
        - "--gpu-memory-utilization=0.90"
        # 128K context. ~33.5 GB/GPU KV cache headroom with FP8 on L40S
        # comfortably supports 128K — could push to 256K if needed.
        - "--max-model-len=131072"
        # Distribute the model across all 4 GPUs on this node.
        - "--tensor-parallel-size=4"
        # FP8 block quantization (RedHatAI/gemma-4-31B-it-FP8-block).
        # Uses compressed-tensors format — vLLM auto-detects from model config.
        # On A10G (Ampere): weights stored as FP8, compute dequantized to BF16.
        # On L40S (Ada Lovelace): native FP8 tensor cores used for compute.
        - "--enable-prefix-caching"
        # Tool calling and reasoning: use Gemma 4-specific parsers.
        - "--enable-auto-tool-choice"
        - "--tool-call-parser=gemma4"
        - "--reasoning-parser=gemma4"
      ports:
        - containerPort: 8000
          name: vllm
          protocol: TCP
      resources:
        requests:
          cpu: "8"
          memory: "64Gi"
          nvidia.com/gpu: "4"
        limits:
          cpu: "16"
          memory: "128Gi"
          nvidia.com/gpu: "4"
      mountModelVolume: true
      startupProbe:
        httpGet:
          path: /v1/models
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 80   # 40 min window for cold start
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /v1/models
          port: 8000
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
