apiVersion: v2
name: vllm-server
description: |
  One vLLM inference server instance for the kinference harness.
  Each release renders a PV (Mountpoint S3, ReadOnlyMany), a PVC, a
  Deployment configured to publish KV-cache events on ZMQ 5557/5558 and
  serve OpenAI + /metrics on 8000, and a headless ClusterIP Service.
type: application
version: 0.1.0
appVersion: "vllm-openai"
