{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kinference.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "httpRoute.enabled requires httpRoute.parentRef.name (the Gateway to attach to)" .Values.httpRoute.parentRef.name }}
      # A Gateway in another namespace has to allow the attachment from this
      # one (its listener's allowedRoutes.namespaces).
      namespace: {{ .Values.httpRoute.parentRef.namespace | default .Release.Namespace }}
      {{- with .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.path }}
      {{- range .Values.httpRoute.extraPathPrefixes }}
        - path:
            type: PathPrefix
            value: {{ . }}
      {{- end }}
      backendRefs:
        - name: {{ include "kinference.fullname" . }}
          port: {{ .Values.service.dashboardPort }}
          weight: 1
{{- end }}
