# The gRPC server is plaintext. Every call for one request must reach the
# same replica, so per-request L7 balancing in front of it is not supported.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kinference.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kinference.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
