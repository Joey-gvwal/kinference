{{- if .Values.extension.enabled }}
# Puts kinference in a gateway's request path. Bindings in every namespace
# reference this one object; admitting them all is safe because the config
# holds no secret.
apiVersion: gateway.linkerd.io/v1alpha1
kind: Extension
metadata:
  name: {{ .Values.extension.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
spec:
  class: kinference_selector
  allowedReferences:
    namespaces:
      from: All
  config:
    # Past one replica this needs per-pod routing; see templates/deployment.yaml.
    service: {{ include "kinference.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.grpcPort }}
    {{- with .Values.extension.tenantHeader }}
    # Without it every request is tenant="default" in the metrics.
    tenantHeader: {{ . }}
    {{- end }}
    {{- with .Values.extension.qos }}
    qos: {{ . }}
    {{- end }}
{{- end }}
