# Qwen 2.5 32B AWQ — a dense, pure-attention model, so the straightforward case:
# no Mamba state, no interleaved-attention page inflation, and (expected) a
# published block granularity that matches the engine's --block-size of 16.
#
# VERIFY kvBlockSize BEFORE TRUSTING IT. It is the tokens-per-block in the
# events the engine PUBLISHES, which is not always --block-size — Gemma 4
# reports 64 and publishes 256. If this value is wrong, every block is dropped
# before it reaches the radix tree and the failure is SILENT: events arrive,
# `index.blocks` stays 0, and every pick degrades to load-only with no error.
# The tell is in kinference's logs:
#     Block not published. Block size must be 16 tokens to be published.
#     Block size is: M
# Set this to M.
apiVersion: kinference.buoyant.io/v1alpha1
kind: InferenceWorkerSet
metadata:
  name: qwen-2-5-32b
  namespace: default
spec:
  # Must name a [[profile]] in configmap.yaml. There is no Qwen 2.5 profile
  # yet — add one (copying qwen-3-6-35b-a3b-l40s is a reasonable start, then
  # refit from latency.csv) or this set is refused with
  # Accepted=False/UnknownProfile and nothing routes to it.
  profile: default
  kvBlockSize: 16

  serviceRef:
    name: qwen-vllm
    port: http
  kvEvents:
    port: kv-pub

  # Short names clients can ask for instead of the full checkpoint. `name` is
  # what the engine reports on /v1/models and stays routable on its own; the
  # aliases are additive. NOTE: alias
  # resolution runs only on the policy path — it needs `[policy] enabled = true`
  # plus an InferencePool named on the Pick. With policy off (the current
  # config) this is inert and clients must use the upstream name.
  models:
    - name: Qwen/Qwen2.5-32B-Instruct-AWQ
      aliases: [qwen-2.5, qwen-simple]
