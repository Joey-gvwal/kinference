# Internal ClusterIP service for direct in-cluster access to the 31B vLLM pod.
#
# The llm-d-inference-gateway only accepts traffic from the ALB, so pods that
# need to call the OpenAI-compatible API internally (e.g. linky)
# use this service instead of going through the gateway.
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-4-31b-vllm
  namespace: default
spec:
  selector:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: gemma-4-31b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
