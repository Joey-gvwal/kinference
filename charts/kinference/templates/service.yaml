# ClusterIP service. Two ports:
#   - dashboard — live /api/snapshot + the embedded React SPA
#   - grpc      — what consumers call for Pick()
#
# ClusterIP keeps all ports internal. To reach them from your laptop:
#
#   kubectl port-forward svc/<release> 50051:grpc 9001:dashboard
#
# If you'd rather expose externally, set service.type=LoadBalancer and
# consider TLS — the gRPC server is plaintext.
#
# NOTE the caller-side constraint (see templates/deployment.yaml): every call
# for one request must reach the SAME replica. A ClusterIP Service balances
# connections rather than requests, so one long-lived gRPC connection per
# caller gives this for free. Per-request L7 balancing in front of kinference is
# NOT supported.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kinference.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kinference.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: dashboard
      port: {{ .Values.service.dashboardPort }}
      targetPort: dashboard
      protocol: TCP
