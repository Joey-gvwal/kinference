# The worker set kinference routes to. Creating this object is what materializes a
# pool; deleting it retires the pool. No kinference config change, no restart.
#
# `profile` must name a [[profile]] in configmap.yaml's config.toml. Naming one
# that isn't defined is not a silent fallback — the set gets
# Accepted=False/UnknownProfile and nothing routes to it — because falling back
# would mean serving real traffic on coefficients nobody chose.
apiVersion: kinference.buoyant.io/v1alpha1
kind: InferenceWorkerSet
metadata:
  name: qwen-3-6-35b-a3b
  namespace: default
spec:
  profile: default
  kvBlockSize: 16

  serviceRef:
    name: qwen-3-6-35b-a3b-vllm
    port: http
  kvEvents:
    port: kv-pub

  models:
    - {name: Qwen/Qwen3.6-35B-A3B, aliases: [qwen3.6]}
