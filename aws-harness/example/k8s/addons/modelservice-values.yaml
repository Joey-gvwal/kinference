# llm-d-modelservice values — Gemma 4 26B MoE AWQ on EKS GPU nodes
#
# Deploys vLLM as a Deployment (not KServe InferenceService).
# Inference-scheduling mode: decode-only, no prefill/decode disaggregation.
#
# Project:   https://github.com/llm-d-incubation/llm-d-modelservice
# Helm repo: https://llm-d-incubation.github.io/llm-d-modelservice/
# Chart:     llm-d-modelservice/llm-d-modelservice (v0.4.9)
#
# Install (via make inference):
#   helm upgrade --install gemma-4-26b llm-d-modelservice/llm-d-modelservice \
#     --namespace default -f k8s/addons/modelservice-values.yaml \
#     --version v0.4.9 --wait --timeout 15m
#
# Prerequisites:
#   • make addons   — installs S3 CSI driver and applies the S3 PV/PVC
#   • make init-weights — downloads model weights to S3 (one-time ~20-40 min)

multinode: false

modelArtifacts:
  # name is the value of the "model" field in OpenAI API requests
  name: "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit"
  # pvc:// URI mounts the named PVC at /model-cache; vLLM reads weights from there.
  # The PVC is backed by the Mountpoint for S3 CSI driver (ReadOnlyMany),
  # pointing to s3://471112539178-us-west-2/weights/gemma-4-26b-awq/.
  # Multiple decode pods can mount this PVC simultaneously — no EBS clone needed.
  uri: "pvc://gemma-4-26b-weights/"
  # AWQ INT4 weights on disk: ~13 GB. 20 Gi matches the PVC size.
  size: 20Gi
  # Labels added to all serving pods.
  # Must match inferencePool.modelServers.matchLabels in gaie-values.yaml.
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: gemma-4-26b

routing:
  servicePort: 8000
  # Disable routing sidecar — not needed for decode-only (no P/D disaggregation)
  proxy:
    enabled: false
    targetPort: 8000

accelerator:
  type: nvidia

# ── Decode pods (vLLM inference servers) ──────────────────────────────────────
decode:
  create: true
  replicas: 1  # scale to 2 via `make inference-scaled` (requires clone-weights for second PVC)

  # Extend the Deployment progress deadline to cover the full cold-start time:
  #   image pull  ~5 min (first time; cached on subsequent pulls)
  #   CUDA init   ~4 min
  #   EBS weights ~1 min
  #   readiness   ~1 min
  # Default is 600s (10 min) which is too tight for a fresh pod.
  progressDeadlineSeconds: 1800  # 30 min

  # Pin to GPU nodes so the EBS volume binds in the correct AZ.
  nodeSelector:
    role: gpu

  parallelism:
    tensor: 1   # 1 GPU per pod (Gemma 4 26B-A4B AWQ ~13 GB fits easily on a single L40S)
    data: 1
    dataLocal: 1
    workers: 1

  containers:
    - name: "vllm"
      # vllm/vllm-openai:gemma4 is the dedicated tag bundling transformers>=5.5.0,
      # which is required for the gemma4 architecture. The plain v0.19.0 tag ships
      # with an older transformers that doesn't recognize gemma4.
      # Trade-off vs llm-d-cuda: does not emit ZeroMQ KV-cache events, so the
      # EPP prefix-cache scorer has no data and falls back to routing by
      # KV-cache utilization + queue depth only. Acceptable for now.
      # To cache in ECR for faster node pulls (~15 GB image):
      #   aws ecr create-repository --repository-name vllm-openai --region us-west-2
      #   crane copy docker.io/vllm/vllm-openai:gemma4 \
      #     471112539178.dkr.ecr.us-west-2.amazonaws.com/vllm-openai:gemma4
      image: "vllm/vllm-openai:gemma4"
      modelCommand: vllmServe
      imagePullPolicy: IfNotPresent
      env:
        # flashinfer JIT cache defaults to ~/.cache/flashinfer which is not writable
        # in the vllm container. Redirect home to /tmp so all XDG-style caches land
        # somewhere writable regardless of the exact env var flashinfer reads.
        - name: HOME
          value: /tmp
        - name: FLASHINFER_WORKSPACE_DIR
          value: /tmp/flashinfer
        # Reduces memory fragmentation so the allocator can reuse reserved-but-free
        # blocks instead of requesting new allocations that push over the OOM edge.
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      args:
        # Removed --disable-uvicorn-access-log to enable per-request HTTP logging.
        # Each request logs: method, path, status code, and latency.
        # AWQ INT4 weights ~13 GB leaves ~33 GiB for KV cache — very comfortable.
        - "--gpu-memory-utilization=0.95"
        # Gemma 4 26B-A4B has native 256K context. We cap at 64K to preserve
        # KV cache headroom — plenty for most use cases.
        - "--max-model-len=65536"
        # AWQ INT4 weights quantized via llm-compressor (compressed-tensors format).
        # Do not set --quantization here — vLLM reads quantization_config from the
        # model's config.json automatically. Overriding with awq_marlin causes a
        # validation error because the checkpoint declares compressed-tensors.
        # Enables vLLM's internal prefix KV-cache (token-block deduplication).
        # Note: without llmd_fs_backend the EPP cannot see these blocks, but
        # prefix caching still benefits single-pod reuse within one replica.
        - "--enable-prefix-caching"
        # Tool calling and reasoning: use Gemma 4-specific parsers.
        - "--enable-auto-tool-choice"
        - "--tool-call-parser=gemma4"
        - "--reasoning-parser=gemma4"
      ports:
        - containerPort: 8000
          name: vllm
          protocol: TCP
      resources:
        requests:
          cpu: "2"
          memory: "16Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "28Gi"
          nvidia.com/gpu: "1"
      mountModelVolume: true
      # Generous startup probe — HF download takes ~10 min; EBS cache ~3 min.
      # The EPP will only route to pods that pass the readiness check.
      startupProbe:
        httpGet:
          path: /v1/models
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 60   # 30 min window for cold start
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /v1/models
          port: 8000
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
