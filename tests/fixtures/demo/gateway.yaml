apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kinference
  namespace: default
spec:
  gatewayClassName: buoyant-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same          # only routes in the same namespace can attach
