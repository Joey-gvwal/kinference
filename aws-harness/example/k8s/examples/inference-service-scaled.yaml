# Scaled InferenceService — Mistral 7B on both GPU nodes using EBS cloned volumes.
#
# Prerequisites:
#   • `make init-weights` completed  (mistral-7b-weights PVC populated)
#   • `make clone-weights` completed (mistral-7b-weights-1 PVC created from snapshot)
#   • vllm-runtime ServingRuntime applied
#
# Creates two InferenceService objects, each pinned to its own EBS volume:
#   mistral-7b   → mistral-7b-weights    → node 0
#   mistral-7b-1 → mistral-7b-weights-1  → node 1
#
# Traffic is split 50/50 by httproute-scaled.yaml.
# Both serve the same model name ("mistral-7b") so clients need no changes.
#
# Note: maxReplicas: 1 per IS — EBS ReadWriteOnce allows one node per volume.
# For more than 2 nodes, run `make clone-weights` again to produce more PVCs
# and add corresponding IS objects here.

---
# ── Node 0: primary EBS volume ────────────────────────────────────────────────
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: mistral-7b
  namespace: default
  annotations:
    llmd.io/enabled: "true"
    llmd.io/routing-strategy: "kv-cache-aware"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: mistral-7b-weights
          readOnly: true
    model:
      modelFormat:
        name: vllm
      runtime: vllm-runtime
      env:
        - name: MODEL_NAME
          value: "/model-cache"
      volumeMounts:
        - name: model-cache
          mountPath: /model-cache
          readOnly: true
      resources:
        requests:
          cpu: "2"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "14Gi"
          nvidia.com/gpu: "1"

---
# ── Node 1: snapshot-cloned EBS volume ───────────────────────────────────────
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: mistral-7b-1
  namespace: default
  annotations:
    llmd.io/enabled: "true"
    llmd.io/routing-strategy: "kv-cache-aware"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: mistral-7b-weights-1
          readOnly: true
    model:
      modelFormat:
        name: vllm
      runtime: vllm-runtime
      env:
        - name: MODEL_NAME
          value: "/model-cache"
      volumeMounts:
        - name: model-cache
          mountPath: /model-cache
          readOnly: true
      resources:
        requests:
          cpu: "2"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "14Gi"
          nvidia.com/gpu: "1"
