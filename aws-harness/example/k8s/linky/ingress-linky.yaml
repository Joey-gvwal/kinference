# ingress-linky.yaml — ALB Ingress for linky (/).
#
# Part of the "linky-inference" IngressGroup.  Lower group.order (20) means
# this rule is evaluated after the inference rule (10), so /v1 always wins.
# Everything else — including the root path — goes to linky.
#
# Lives in the linky namespace so it can reference the service
# directly, while still sharing the same ALB as the inference ingress.
#
# Applied by `make linky-server`, removed by `make linky-server-down`.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linky-public
  namespace: linky
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: linky-inference
    alb.ingress.kubernetes.io/group.order: "20"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linky
                port:
                  number: 8080
