# InferenceModel — maps the OpenAI "model" field in API requests to the 31B InferencePool.
#
# spec.modelName must match:
#   1. The "model" field clients send in API requests
#   2. The model name vLLM is serving (set by modelArtifacts.name in modelservice-values-31b.yaml)
#
# Applied by: make -f Makefile.31b inference
apiVersion: inference.networking.k8s.io/v1alpha2
kind: InferenceModel
metadata:
  name: gemma-4-31b
  namespace: default
spec:
  modelName: "google/gemma-4-31B-it"
  criticality: Standard
  poolRef:
    name: gemma-4-31b-pool
