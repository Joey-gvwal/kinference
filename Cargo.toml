[workspace]
members = [".", "crates/kinference-policy", "crates/kinference-fleet", "crates/kinfctl"]
default-members = [".", "crates/kinference-policy", "crates/kinference-fleet", "crates/kinfctl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85; kube 4.2 raises the real floor to 1.89.
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
kinference-policy = { path = "crates/kinference-policy" }
kinference-fleet = { path = "crates/kinference-fleet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
kube = { version = "4", default-features = false }
k8s-openapi = { version = "0.28", features = ["latest"] }
getrandom = "0.2"
dynamo-kv-router = { git = "https://github.com/ai-dynamo/dynamo", rev = "12207ba2cb397e40e260d39bce3f65c6fc799a49", default-features = false }
tokio = "1"
tokio-util = "0.7"
zmq = "0.10"
reqwest = { version = "0.12", default-features = false }
dashmap = "6"
prometheus-parse = "0.2"
prometheus = { version = "0.13", default-features = false }

[workspace.lints.clippy]
# Service-facing functions return `tonic::Status` (and `(Status, RejectReason)`)
# by contract, and `Status` is a large type. Boxing gRPC errors on a cold path
# is unidiomatic churn at every call site, so the lint is off crate-wide rather
# than allowed at each of the handful of signatures it flags.
result_large_err = "allow"

[package]
name = "kinference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kinference-policy.workspace = true
kinference-fleet.workspace = true
dynamo-kv-router.workspace = true
tonic = "0.12"
prost = "0.13"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
# `ReceiverStream` for wrapping our mpsc::Receiver into the
# `tonic::codegen::tokio_stream::Stream` shape the server-streaming
# `PullBody` method requires. Already a transitive dep via tonic, but
# pulled in directly for clarity.
tokio-stream = "0.1"
serde.workspace = true
zmq = "0.10"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde_json.workspace = true
dashmap.workspace = true
# The exposition side: the typed registry and counters behind our own
# /metrics endpoint. The scrape side, `prometheus-parse`, is the fleet's.
prometheus.workspace = true
axum = "0.7"
# K8s discovery and the kinference.buoyant.io CRD
# watch/status writer. Two client-construction policies live in the tree
# deliberately: `Config::incluster_env()` in `controller::discovery` (kubeconfig
# is refused there because pod IPs are unroutable from outside the cluster) and
# `Config::infer()` in `policy::{store,status}` so the controller side stays
# testable against a local cluster.
kube = { workspace = true, features = ["client", "runtime", "rustls-tls"] }
k8s-openapi.workspace = true
futures = "0.3"
# Scout-mode in-process tokenization. `http` feature enables
# `Tokenizer::from_pretrained` Hub fetch; `onig` provides the regex
# pre-tokenizer most modern models need. Skip default features to
# avoid pulling python-binding scaffolding.
tokenizers = { version = "0.23", default-features = false, features = ["http", "onig"] }
# Jinja2-compatible template renderer for chat templates loaded from
# tokenizer_config.json. Small, single-dep, serde-context-friendly.
# `loop_controls` enables `{% break %}` / `{% continue %}` (used by
# Mistral / some Hermes templates); `json` enables the `tojson`
# filter (used by Llama 3.2 vision and others to render tool
# definitions).
minijinja = { version = "2.20", features = ["loop_controls", "json"] }
# `pycompat` lives in `minijinja-contrib` (not the core crate). It
# ships an unknown-method callback that maps Python-style dict methods
# like `.get(key, default)` / `.items()` / `.keys()` to minijinja
# equivalents — Gemma 3/4 chat templates call
# `message.get('reasoning')` and friends, so without this the template
# fails at render with "map has no method named get". The env in
# `tokenizer::local::render_chat_template` wires the callback per env.
minijinja-contrib = { version = "2.20", features = ["pycompat"] }
# Used by `tokenizer::local::render_chat_template` to register the
# `strftime_now` Jinja global (Llama 3.1+ chat templates call it for
# the system message's date line). Already transitively pulled in by
# `k8s-openapi` so this adds nothing to compile time. Default features
# (clock, std) give us `chrono::Utc::now()` + `.format(strftime_str)`.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom.workspace = true

[lints]
workspace = true

[dev-dependencies]
# `PoolId::from_raw`, for tests that need a specific pool id.
kinference-policy = { workspace = true, features = ["test-util"] }
# `test_pool` and friends, for tests that need a pool or a scrape sample.
kinference-fleet = { workspace = true, features = ["test-util"] }
# `ServiceExt::oneshot`, to drive the admin router in tests exactly as a
# client would. Already in the tree through axum; this only names the feature.
tower = { version = "0.5", features = ["util"] }
# Scoped temp directories for tests that need to lay out a mounted
# tokenizer directory on disk (Gemma 3/4 sibling-file chat template
# fallback).
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"
# Bundled `protoc` binary + the google/protobuf/*.proto well-known
# Avoids depending on whatever protoc happens to be in the Docker base
# image, or on one being installed at all. `kinference.proto` imports no
# well-known types, so this is now about availability and version skew
# rather than about bundled includes.
protoc-bin-vendored = "3"
