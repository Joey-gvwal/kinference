# vLLM on CPU with random-init weights and a 135M model, for the smoke test.
# Responses are garbage text in valid OpenAI JSON, but the KV-cache events on
# ZMQ 5557 are real.
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-vllm
  namespace: default
  labels:
    mm/managed-by: model-harness
    mm/engine: vllm
    mm/server-name: dummy-vllm
    app.kubernetes.io/component: inference
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: kv-pub
      port: 5557
      targetPort: 5557
      protocol: TCP
    - name: kv-replay
      port: 5558
      targetPort: 5558
      protocol: TCP
  selector:
    app.kubernetes.io/name: dummy-vllm
    app.kubernetes.io/instance: dummy-vllm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-vllm
  namespace: default
  labels:
    mm/managed-by: model-harness
    mm/engine: vllm
    mm/server-name: dummy-vllm
    app.kubernetes.io/name: dummy-vllm
    app.kubernetes.io/instance: dummy-vllm
    app.kubernetes.io/component: inference
  annotations:
    mm/model: "HuggingFaceTB/SmolLM2-135M-Instruct"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dummy-vllm
      app.kubernetes.io/instance: dummy-vllm
  template:
    metadata:
      labels:
        mm/managed-by: model-harness
        mm/engine: vllm
        mm/server-name: dummy-vllm
        app.kubernetes.io/name: dummy-vllm
        app.kubernetes.io/instance: dummy-vllm
        app.kubernetes.io/component: inference
      annotations:
        mm/model: "HuggingFaceTB/SmolLM2-135M-Instruct"
    spec:
      containers:
        - name: vllm
          # Community CPU build; the official image is GPU-only. Pinned by
          # digest (docker buildx imagetools inspect mekayelanik/vllm-cpu:latest).
          image: mekayelanik/vllm-cpu@sha256:fd2862489fe516b00df7af3ee6ca257628ad99b334e7d411a261452ef2f98aa2
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - HuggingFaceTB/SmolLM2-135M-Instruct
            - --host=0.0.0.0
            - --port=8000
            # Config and tokenizer are still fetched from HF (~5 MB).
            - --load-format=dummy
            # No `--device=cpu`: vLLM 0.7+ accepts only integer indexes there.
            - --enforce-eager
            - --max-model-len=4096
            - --max-num-seqs=8
            # On CPU this is the fraction of available memory to reserve;
            # the 0.92 default fails where other containers hold memory.
            - --gpu-memory-utilization=0.3
            # Kubelet substitutes $(POD_IP) and $(POD_PORT).
            - >-
              --kv-events-config={"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558","topic":"kv@$(POD_IP):$(POD_PORT)@HuggingFaceTB/SmolLM2-135M-Instruct"}
            - --enable-prefix-caching
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_PORT
              value: "5557"
            # Dev endpoints such as /reset_prefix_cache; never in production.
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/huggingface
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: DO_NOT_TRACK
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            # The CPU image lacks the headers torch.compile needs, and
            # --enforce-eager does not turn inductor off.
            - name: TORCH_COMPILE_DISABLE
              value: "1"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
            - containerPort: 5557
              name: kv-pub
              protocol: TCP
            - containerPort: 5558
              name: kv-replay
              protocol: TCP
          resources:
            # Fits a 2-core CI runner next to kind's system pods and kinference.
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/huggingface
            - name: tmp
              mountPath: /tmp
            # vLLM needs 160+ MiB of /dev/shm for worker IPC; the default is 64.
            - name: dshm
              mountPath: /dev/shm
          # Allows the first start to fetch the model config and tokenizer.
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: hf-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Counts against the memory limit.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
