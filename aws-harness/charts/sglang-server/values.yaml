# Defaults for one SGLang server instance. Per-server overrides come from
# servers/<name>.toml via scripts/render-server.sh.

# Helm release name doubles as the in-cluster identity (Deployment / Service /
# PV / PVC). Must be DNS-safe (lowercase alphanumeric + '-').
# Pods are named `<release>-<rs-hash>-<random>` per Deployment convention;
# names rotate on every rollout (new pods get a fresh hash + random suffix).
nameOverride: ""

# Number of replica pods. Each replica is its own pod with its own
# KV-event publisher. Deployment creates all replicas in parallel by
# default — no ordering knob needed.
replicas: 1

# SGLang container image. Default pinned to a known-good release tag so a
# server TOML that omits `image` still gets a reproducible deploy. With
# pullPolicy: IfNotPresent + a versioned tag, all pods of a replicated
# Deployment are guaranteed to run identical code; with `latest` they
# could diverge as different nodes pull different digests over time.
image:
  repository: lmsysorg/sglang
  tag: v0.5.12.post1
  pullPolicy: IfNotPresent

# Model identity. `name` is what clients send as the "model" field in
# OpenAI-API requests AND what SGLang reports as the served-model-name.
# The weights themselves are mounted at /model-cache; the name is just a
# label so the harness's monitor-config generator and downstream tooling
# can route requests.
model:
  name: ""
  # SGLang's paged-attention block size (the "page size" in their docs).
  # Two modes (matches vllm-server chart):
  #   Explicit integer — passed as --page-size=N AND stamped on the pod
  #     as `mm/block-size` annotation.
  #   Empty (default) — no --page-size flag; SGLang picks its own; the
  #     annotation is omitted, so kinference must discover the value at
  #     runtime.
  blockSize: ""

# Where the safetensors live in the shared S3 bucket. Mountpoint S3 mounts
# `s3://{bucket}/{prefix}` read-only at /model-cache inside the container.
weights:
  bucket: "471112539178-us-west-2"
  prefix: ""          # e.g. "weights/qwen-2-5-32b-awq/"
  region: "us-west-2"
  # Informational only — S3 has no fixed quota, but Kubernetes wants a
  # capacity number on the PV.
  capacity: 64Gi

# GPU allocation. tensor parallel size is passed straight through to
# sglang.launch_server as --tp.
gpu:
  count: 1
  tensorParallelSize: 1
  # Optional node-pool selector; mirrors the vLLM chart. Pins pod to a
  # specific GPU node group via `gpu-pool: <value>` nodeSelector label
  # (e.g. "l40s", "h200"). Leave empty for any-GPU scheduling.
  nodePool: ""

# Ports. Same triple as the vLLM chart so port-forward.sh and
# gen-monitor-config.sh (which assume 8000/5557/5558 per server, offset by
# 1000 per additional server) work unchanged.
# SGLang's default HTTP port is 30000; we override via --port below.
ports:
  http: 8000
  kvEventsPub: 5557
  kvEventsReplay: 5558

# Extra args appended to `python3 -m sglang.launch_server`. Use this for
# --context-length, --mem-fraction-static, --quantization, etc.
extraArgs: []

resources:
  requests:
    cpu: "2"
    memory: "16Gi"
  limits:
    cpu: "4"
    memory: "28Gi"
    # nvidia.com/gpu is added at render time from gpu.count.

# Abort a stuck rollout after this many seconds — covers genuinely-wedged
# pods (bad image, OOM during model load) without burning forever. 30 min
# matches the startupProbe budget configured in the Deployment template
# (initialDelaySeconds 30 + periodSeconds 30 × failureThreshold 60).
progressDeadlineSeconds: 1800

# Rolling-update strategy. Default `maxSurge=0, maxUnavailable=1` is
# GPU-friendly: rollout terminates one old pod first and the freed GPU
# slot is reused by the new pod, so no extra GPU capacity is needed
# during the rollout window. Trade-off: brief per-pod downtime during
# transitions. Users with spare GPU capacity (e.g. ran `make scale-gpu`
# with headroom) can override to `maxSurge: 1, maxUnavailable: 0` for
# zero-downtime updates.
rollingUpdate:
  maxSurge: 0
  maxUnavailable: 1
