apiVersion: v2
name: sglang-server
description: |
  One SGLang inference server instance for the kinference harness.
  Mirrors charts/vllm-server: each release renders a Mountpoint-S3 PV,
  PVC, headless Service, and a Deployment configured to publish KV-cache
  events on ZMQ 5557/5558 (Dynamo wire format) and serve OpenAI-compatible
  HTTP + /metrics on 8000.
type: application
version: 0.1.0
appVersion: "sglang"
