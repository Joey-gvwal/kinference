{{/*
ClusterIP Service: gives every release a single VIP that load-balances
across all replicas of this Deployment. Used for ad-hoc in-cluster calls
("send a request to any pod of this release"); port-forward.sh targets
pods directly by name and `gen-monitor-config.sh` queries pods directly,
so this Service is the load-balanced affordance, not the per-pod one.

For engine- and model-agnostic per-pod DNS, use the headless `inference`
Service in k8s/addons/inference-service.yaml — it covers every harness-
managed inference pod via the `app.kubernetes.io/component=inference`
selector.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sglang-server.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sglang-server.labels" . | nindent 4 }}
  annotations:
    {{- include "sglang-server.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sglang-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
      protocol: TCP
    - name: kv-pub
      port: {{ .Values.ports.kvEventsPub }}
      targetPort: kv-pub
      protocol: TCP
    - name: kv-replay
      port: {{ .Values.ports.kvEventsReplay }}
      targetPort: kv-replay
      protocol: TCP
