[package]
name = "kinference-policy"
description = "The kinference.buoyant.io CRD types and the policy logic that needs no cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# `PoolId::from_raw`, for tests in other crates.
test-util = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
getrandom = { workspace = true, features = ["std"] }
# Only `derive`: nothing here talks to a cluster.
kube = { workspace = true, features = ["derive"] }
k8s-openapi.workspace = true
# Required by the `CustomResource` derive. The schema is never emitted; the
# hand-written CRDs in charts/kinference-crds are the source of truth.
schemars = "1"
# Same version as kube-client's, so it adds no crate to the build.
serde-saphyr = "0.0.29"
serde_path_to_error = "0.1"

[lints]
workspace = true
