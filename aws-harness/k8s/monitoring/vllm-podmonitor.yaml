# PodMonitor: Prometheus-operator CRD that tells Prometheus to scrape
# every pod matching the selector at the named container port.
#
# Selector targets the cross-engine inference label that both
# charts/vllm-server and charts/sglang-server stamp on their pod
# templates (app.kubernetes.io/component=inference). One PodMonitor
# therefore covers vLLM + SGLang pods uniformly — when a server is
# added or removed via `make -f Makefile.server server-{up,down}`,
# Prometheus picks up the change automatically.
#
# PodMonitor over ServiceMonitor: vLLM/SGLang's /metrics is on the
# pod itself; an in-cluster Service would just add an indirection
# without changing what gets scraped. PodMonitor selects pods
# directly by label.
#
# The named port `http` matches the containerPort.name in both engine
# charts (charts/{vllm,sglang}-server/templates/deployment.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: inference-pods
  namespace: monitoring
  labels:
    # Informational only — not used as a selector by the chart.
    # Prometheus discovers this via podMonitorSelectorNilUsesHelmValues=false
    # in the chart values, so any release label works here.
    app.kubernetes.io/part-of: model-harness
spec:
  namespaceSelector:
    # vLLM / SGLang pods land in the `default` namespace per the
    # harness's Makefile.server.
    matchNames:
      - default
  selector:
    matchLabels:
      app.kubernetes.io/component: inference
  podMetricsEndpoints:
    - port: http
      path: /metrics
      # 2s scrape interval — benchmark cluster needs fine-grained
      # queue-depth view (the per-instance dashboard's stacked panel
      # is borderline unreadable at the 15s default). Trade-off: ~7.5×
      # more samples vs 15s. With ~150 vLLM series per pod and 5 pods,
      # this is ~225 samples/sec = ~2 MB/min raw, well within the
      # 1 GiB Prometheus memory budget for the head block.
      # If you ever hit storage pressure (retentionSize: 10GB in the
      # chart values), bump back to 5s or shorten retention.
      interval: 2s
      # Timeout must be < interval; 1.5s leaves headroom for vLLM's
      # /metrics handler under load.
      scrapeTimeout: 1500ms
