# Example InferenceService — Mistral 7B Instruct (fp16, ~14 GB VRAM)
# Good starting point: fits comfortably on a single g5.xlarge (24 GB VRAM).
#
# To deploy a different model, change:
#   1. metadata.name
#   2. spec.predictor.model.storageUri
#   3. resources if moving to 13B+ (see comments)
#
# Requires:
#   • vllm-runtime ServingRuntime applied (k8s/runtimes/vllm-serving-runtime.yaml)
#   • KServe installed and running
#   • GPU nodes ready (check: kubectl get nodes -l role=gpu)
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: mistral-7b
  namespace: default
  annotations:
    # Let llm-d manage routing for this service.
    llmd.io/enabled: "true"
    llmd.io/routing-strategy: "kv-cache-aware"
spec:
  predictor:
    # ── Scaling ─────────────────────────────────────────────────────────────
    # minReplicas/maxReplicas live at spec.predictor in KServe v0.15+
    # (moved up from spec.predictor.model in older versions).
    minReplicas: 1   # keeps one pod warm; set to 0 for scale-to-zero
    maxReplicas: 3   # match gpu_node_count in terraform/variables.tf

    model:
      modelFormat:
        name: vllm
      runtime: vllm-runtime

      # ── Model source ────────────────────────────────────────────────────
      # Pass the HuggingFace model ID via env var so vLLM downloads it directly.
      # This avoids KServe's storage initializer, which doesn't handle hf:// reliably.
      # vLLM caches weights under /root/.cache/huggingface on the node's 100 GB disk.
      env:
        - name: MODEL_NAME
          value: "mistralai/Mistral-7B-Instruct-v0.3"

      # Option B: Pre-cached in S3 (faster cold starts, required for private models).
      # storageUri: "s3://your-model-bucket/mistral-7b-instruct/"

      # ── Resources ───────────────────────────────────────────────────────
      # These mirror the ServingRuntime defaults; override here per-model.
      resources:
        requests:
          cpu: "2"
          memory: "8Gi"          # CPU-side RAM — model weights live on GPU VRAM
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "14Gi"         # Fits within g6/g5.xlarge allocatable (~15Gi)
          nvidia.com/gpu: "1"

---
