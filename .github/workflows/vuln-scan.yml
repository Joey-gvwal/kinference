name: vuln-scan

# The schedule catches new advisories against unchanged code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The grype jobs fail only on high or critical findings that have a fix to
# move to.
jobs:
  # Rust crates, from Cargo.lock. The binaries aren't built with
  # cargo-auditable, so the image scan can't see them.
  grype-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          path: .
          output-format: table
          severity-cutoff: high
          only-fixed: true
          cache-db: true

  # Fails on any RustSec vulnerability and on yanked crates, which grype
  # doesn't report.
  cargo-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037
        with:
          tool: cargo-audit
      # Called directly so the cargo proxy doesn't install the pinned
      # toolchain; only Cargo.lock is read.
      - run: cargo-audit audit --deny yanked

  # OS packages in the runtime image.
  grype-image:
    runs-on: ubuntu-24.04
    # Cold image build, as in ci.yml's test-smoke.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - run: just image
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: kinference:latest
          output-format: table
          severity-cutoff: high
          only-fixed: true
          cache-db: true
