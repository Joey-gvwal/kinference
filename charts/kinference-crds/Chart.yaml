apiVersion: v2
name: kinference-crds
description: >-
  The kinference.buoyant.io CustomResourceDefinitions kinference watches
  (InferencePool, InferencePolicy, InferenceProvider, InferenceWorkerSet).
  Install and upgrade this chart before the kinference chart. The CRDs live
  in templates/ so `helm upgrade` applies schema changes; `helm uninstall`
  therefore deletes them and every CR in the cluster.
type: application
# Dev placeholders; the release workflow sets both.
version: 0.1.0
appVersion: "0.1.0"
