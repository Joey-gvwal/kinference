# cert-manager Helm values
# cert-manager is a prerequisite for KServe (manages TLS certificates for webhooks).
# Chart: https://charts.jetstack.io
# Version: ~1.16
#
# Install command (see scripts/install-addons.sh):
#   helm upgrade --install cert-manager jetstack/cert-manager \
#     --namespace cert-manager --create-namespace \
#     --version "v1.16.5" \
#     -f k8s/addons/cert-manager-values.yaml

crds:
  enabled: true   # Install CRDs as part of the Helm release

# One replica is sufficient for dev/test.
# Increase to 2 for HA in production.
replicaCount: 1

# Keep resource requests light on the system nodes.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
