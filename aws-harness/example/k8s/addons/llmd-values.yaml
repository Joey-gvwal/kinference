# llm-d-infra Helm values
# llm-d-infra deploys the gateway/networking layer for the llm-d inference system.
# It creates the Gateway resource (llm-d-inference-gateway) that HTTPRoutes
# attach to, backed by agentgateway.
#
# Project:   https://github.com/llm-d-incubation/llm-d-infra
# Helm repo: https://llm-d-incubation.github.io/llm-d-infra
# Chart:     llm-d-infra/llm-d-infra
#
# Prerequisites:
#   1. Gateway API CRDs v1.5.1+
#   2. agentgateway installed — see scripts/install-addons.sh
#
# Install command (see scripts/install-addons.sh):
#   helm repo add llm-d-infra https://llm-d-incubation.github.io/llm-d-infra
#   helm upgrade --install llm-d llm-d-infra/llm-d-infra \
#     --namespace llmd --create-namespace \
#     -f k8s/addons/llmd-values.yaml

gateway:
  enabled: true

  # Gateway implementation.
  # "agentgateway" is the lighter, forward-looking option (no service mesh required).
  # "istio" is the heavier default; "kgateway" is deprecated.
  provider: agentgateway

  # Keep the gateway internal to the cluster — access via kubectl port-forward
  # or add an ingress later. Change to "external" to get a public LoadBalancer.
  exposure:
    type: internal

  service:
    type: ClusterIP

  # Single HTTP listener on port 80. Add a TLS listener here for production.
  listeners:
    - name: default
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

# Ingress disabled — use kubectl port-forward for local access.
# Enable and configure if you want a stable hostname outside the cluster.
ingress:
  enabled: false
