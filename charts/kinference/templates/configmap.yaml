apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kinference.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
data:
  {{ include "kinference.configFileName" . }}: |
    {{- include "kinference.configContents" . | nindent 4 }}
