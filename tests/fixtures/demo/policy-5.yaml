# Batch work runs only where there is no backlog; interactive traffic is
# untouched. The point is that batch never queues behind — or ahead of —
# latency-sensitive work.
apiVersion: kinference.buoyant.io/v1alpha1
kind: InferencePolicy
metadata: {name: policy-5, namespace: default}
spec:
  # Only batch is constrained. Everything else matches no rule and takes the
  # default `unmatched: ServeLocal`, i.e. routes normally on load.
  rules:
  - name: batch-only-where-nothing-is-queued
    matches:
    - qos: [batch]
    route:
      # Local only. Two reasons, both load-bearing:
      #   1. `queuedPrompts` is a Local-only signal, and absence never matches —
      #      so the exclusion below would NOT drop a provider, and batch would
      #      leak off-cluster past the idleness test.
      #   2. `minimize: PredictedTTFT` is Local-only and is rejected at admission
      #      unless the candidate set is constrained to Local.
      consider:
      - {type: Local}
      exclude:
      - name: require-an-empty-queue
        drop:
          # `backend: {type: Local}` is not redundant with the consider group
          # above: the compiler checks each exclusion on its own, and warns that
          # a bare `queuedPrompts` clause can never drop a non-Local candidate.
          # Stating it keeps the policy warning-free, which is what keeps
          # `HasWarnings` off the CR's status.
          backend:       {type: Local}
          # A MEAN over 30s, so `greaterThan: 0` is far stricter than it looks:
          # it drops a worker that queued anything at all in the window, not
          # one that is queueing right now. That is deliberate here — batch has
          # nowhere urgent to be, and `onEmpty: Reject` below means "wait for a
          # genuinely idle worker" rather than "take a busy one".
          #
          # For an INTERACTIVE rule this threshold would be the wrong shape:
          # use a fractional bound (say 0.5) so a brief spike does not shed
          # load for the next 30 seconds.
          queuedPrompts: {greaterThan: 0}
      select:
      - {minimize: PredictedTTFT}
      # No idle worker means no batch. Stated rather than left to the default,
      # because refusing is the whole intent of the rule: falling through would
      # put batch onto exactly the busy GPUs this exists to protect.
      onEmpty: Reject
