apiVersion: kinference.buoyant.io/v1alpha1
kind: InferencePolicy
metadata: {name: policy-1, namespace: default}
spec:
  rules:
  - name: simple-goes-to-gemma
    matches:
    - model: qwen-2.5
      tag: complexity-low
    route:
      consider:
      - models: {names: [gemma-4]}
      select: [{type: Local, minimize: PredictedTTFT}]
