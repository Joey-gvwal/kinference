# PodMonitor — tells Prometheus to scrape kinference's own /metrics.
#
# WITHOUT THIS FILE THE DASHBOARD IS EMPTY. The harness's other PodMonitor
# (`inference-pods`, in aws-harness/k8s/monitoring/) selects
# `app.kubernetes.io/component: inference`, which is stamped on vLLM and SGLang
# pods — not on kinference. Until this was added, kinference's /metrics had only ever
# been reached by hand through a port-forward.
#
# LIVES IN `default`, NOT `monitoring`. The harness's PodMonitor sits in the
# monitoring namespace, but it does not have to: the chart sets
# `podMonitorSelectorNilUsesHelmValues: false`, so Prometheus discovers a
# PodMonitor in ANY namespace. Keeping this one in `default` matches the rest
# of k8s/, where every namespaced object is in `default`.
#
# PodMonitor over ServiceMonitor, for the same reason the engine side chose it:
# /metrics is on the pod, and going through the Service would add an
# indirection without changing what gets scraped. (Here they would in fact
# resolve identically — the Service port and the container port share the
# name `dashboard`.)
#
# Applied by `make -C k8s/kinference monitoring`, deliberately NOT by `make deploy`
# — this requires the Prometheus Operator CRDs, which a Docker Desktop cluster
# will not have.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kinference
  namespace: default
  labels:
    app.kubernetes.io/name: kinference
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      # The only label on the kinference pod template. See
      # k8s/kinference/deployment.yaml.
      app.kubernetes.io/name: kinference
  podMetricsEndpoints:
      # The CONTAINER PORT NAME, which is still `dashboard` even though the
      # config key that opens the listener was renamed `dashboard_listen` →
      # `admin_listen`. The port name was not renamed with it; renaming it now
      # would also have to move the readinessProbe, which references it by
      # name. `admin` or `metrics` would both be better names — this is a
      # deliberate deferral, not an oversight.
    - port: dashboard
      path: /metrics
      # 10s, not the 2s the engine PodMonitor uses. Two of the families here
      # (`kinference_index_blocks`, `kinference_index_workers`) refresh on a throttled
      # ~10s radix-tree dump rather than per scrape, so scraping faster than
      # that just resamples an unchanged value. Everything else is a counter,
      # where the scrape interval sets resolution rather than accuracy.
      interval: 10s
      scrapeTimeout: 5s
