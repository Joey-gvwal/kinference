<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="'SF Mono', 'Fira Code', monospace" font-size="12">

  <!-- Background -->
  <rect width="1100" height="760" fill="#0f1117"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">wm-inference · Request Path</text>
  <text x="550" y="56" text-anchor="middle" fill="#64748b" font-size="11">AWS EKS · us-west-2 · Mistral 7B on vLLM</text>

  <!-- ══ AWS VPC boundary ══════════════════════════════════════════════════ -->
  <rect x="220" y="72" width="860" height="668" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <text x="234" y="90" fill="#f59e0b" font-size="10" opacity="0.8">AWS VPC  10.0.0.0/16  ·  us-west-2</text>

  <!-- ══ EKS Cluster boundary ═════════════════════════════════════════════ -->
  <rect x="238" y="98" width="826" height="626" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <text x="254" y="116" fill="#3b82f6" font-size="10" opacity="0.9">EKS Cluster  "wm-inference"  ·  Kubernetes 1.30</text>

  <!-- ══ SYSTEM NODES ══════════════════════════════════════════════════════ -->
  <rect x="254" y="126" width="300" height="578" rx="8" fill="#1a2744" stroke="#4f6ef7" stroke-width="1"/>
  <text x="404" y="146" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="bold">SYSTEM NODES  ·  t3.medium × 2  (ON_DEMAND)</text>

  <!-- cert-manager -->
  <rect x="272" y="158" width="264" height="52" rx="6" fill="#1e2d5a" stroke="#6366f1" stroke-width="1"/>
  <text x="286" y="178" fill="#a5b4fc" font-size="11" font-weight="bold">cert-manager  v1.16.5</text>
  <text x="286" y="196" fill="#64748b" font-size="10">TLS certificates for KServe webhooks</text>

  <!-- KServe Controller -->
  <rect x="272" y="222" width="264" height="66" rx="6" fill="#1e2d5a" stroke="#6366f1" stroke-width="1"/>
  <text x="286" y="242" fill="#a5b4fc" font-size="11" font-weight="bold">KServe Controller  v0.16.0</text>
  <text x="286" y="258" fill="#64748b" font-size="10">Watches InferenceService CRDs</text>
  <text x="286" y="274" fill="#64748b" font-size="10">Creates Deployments + Services</text>

  <!-- llm-d -->
  <rect x="272" y="300" width="264" height="80" rx="6" fill="#1e2d5a" stroke="#6366f1" stroke-width="1"/>
  <text x="286" y="320" fill="#a5b4fc" font-size="11" font-weight="bold">llm-d  v1.4.0</text>
  <text x="286" y="336" fill="#64748b" font-size="10">KV-cache-aware request router</text>
  <text x="286" y="352" fill="#64748b" font-size="10">Selects replica based on cache state</text>
  <text x="286" y="368" fill="#64748b" font-size="10">Forwards to KServe ClusterIP service</text>

  <!-- agentgateway -->
  <rect x="272" y="392" width="264" height="80" rx="6" fill="#1e2d5a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="286" y="412" fill="#c4b5fd" font-size="11" font-weight="bold">agentgateway  v1.0.1</text>
  <text x="286" y="428" fill="#64748b" font-size="10">Gateway API implementation (Rust)</text>
  <text x="286" y="444" fill="#64748b" font-size="10">Ingress: ClusterIP :80</text>
  <text x="286" y="460" fill="#64748b" font-size="10">Terminates external HTTP connections</text>

  <!-- NVIDIA Device Plugin -->
  <rect x="272" y="484" width="264" height="52" rx="6" fill="#1e2d5a" stroke="#4f6ef7" stroke-width="1"/>
  <text x="286" y="504" fill="#a5b4fc" font-size="11" font-weight="bold">NVIDIA Device Plugin</text>
  <text x="286" y="520" fill="#64748b" font-size="10">Exposes nvidia.com/gpu resource to scheduler</text>

  <!-- coredns / kube-proxy -->
  <rect x="272" y="548" width="264" height="52" rx="6" fill="#172033" stroke="#334155" stroke-width="1"/>
  <text x="286" y="568" fill="#475569" font-size="11">coredns  ·  kube-proxy  ·  vpc-cni</text>
  <text x="286" y="586" fill="#334155" font-size="10">EKS-managed cluster add-ons</text>

  <!-- Terraform label -->
  <rect x="272" y="612" width="264" height="80" rx="6" fill="#172033" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="404" y="632" text-anchor="middle" fill="#475569" font-size="10" font-weight="bold">Terraform  (local)</text>
  <text x="404" y="650" text-anchor="middle" fill="#334155" font-size="10">terraform-aws-eks ~20.0</text>
  <text x="404" y="666" text-anchor="middle" fill="#334155" font-size="10">terraform-aws-vpc ~5.0</text>
  <text x="404" y="682" text-anchor="middle" fill="#334155" font-size="10">make up / make down</text>

  <!-- ══ GPU NODES ═════════════════════════════════════════════════════════ -->
  <rect x="576" y="126" width="472" height="578" rx="8" fill="#1a2d1a" stroke="#22c55e" stroke-width="1"/>
  <text x="812" y="146" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">GPU NODES  ·  g6.xlarge × 3  (ON_DEMAND)  ·  100 GB gp3</text>
  <text x="812" y="162" text-anchor="middle" fill="#374151" font-size="10">AL2_x86_64_GPU AMI  ·  NVIDIA drivers + CUDA pre-installed</text>

  <!-- vLLM Pod box -->
  <rect x="594" y="174" width="436" height="446" rx="8" fill="#162416" stroke="#16a34a" stroke-width="1.5"/>
  <text x="812" y="194" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="bold">InferenceService: mistral-7b  (KServe-managed Deployment)</text>
  <text x="812" y="210" text-anchor="middle" fill="#374151" font-size="10">ServingRuntime: vllm-runtime  ·  minReplicas: 1  maxReplicas: 3</text>

  <!-- vLLM process -->
  <rect x="612" y="220" width="400" height="200" rx="6" fill="#1f3320" stroke="#15803d" stroke-width="1"/>
  <text x="812" y="240" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">vLLM pod  ·  vllm/vllm-openai:v0.6.4</text>

  <!-- HTTP server layer -->
  <rect x="628" y="252" width="368" height="44" rx="4" fill="#14532d" stroke="#166534" stroke-width="1"/>
  <text x="812" y="270" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">Uvicorn HTTP server  :8080</text>
  <text x="812" y="286" text-anchor="middle" fill="#64748b" font-size="10">OpenAI-compatible API  ·  /v1/chat/completions  ·  /v1/completions  ·  /health</text>

  <!-- Engine process -->
  <rect x="628" y="308" width="368" height="98" rx="4" fill="#14532d" stroke="#166534" stroke-width="1"/>
  <text x="812" y="328" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">vLLM Engine Process  (separate PID)</text>
  <text x="812" y="346" text-anchor="middle" fill="#64748b" font-size="10">Tokenizer  ·  PagedAttention KV cache scheduler</text>
  <text x="812" y="362" text-anchor="middle" fill="#64748b" font-size="10">Continuous batching  ·  Request queue</text>
  <text x="812" y="378" text-anchor="middle" fill="#64748b" font-size="10">IPC socket ↕ Uvicorn process</text>
  <text x="812" y="394" text-anchor="middle" fill="#64748b" font-size="10">--model mistralai/Mistral-7B-Instruct-v0.3  ·  --max-model-len 8192</text>

  <!-- GPU -->
  <rect x="628" y="430" width="368" height="74" rx="4" fill="#1a3a2a" stroke="#15803d" stroke-width="1.5"/>
  <text x="812" y="450" text-anchor="middle" fill="#34d399" font-size="10" font-weight="bold">NVIDIA A10G GPU  ·  24 GB VRAM</text>
  <text x="812" y="468" text-anchor="middle" fill="#64748b" font-size="10">Mistral 7B weights  ~14 GB  (bfloat16)</text>
  <text x="812" y="484" text-anchor="middle" fill="#64748b" font-size="10">CUDA kernels: FlashAttention  ·  FlashInfer  ·  cuBLAS</text>
  <text x="812" y="500" text-anchor="middle" fill="#374151" font-size="10">nvidia.com/gpu: 1  (requested + limit)</text>

  <!-- Resources / probes -->
  <rect x="612" y="514" width="400" height="94" rx="6" fill="#0f1e12" stroke="#166534" stroke-width="1"/>
  <text x="812" y="534" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">Pod resources  &amp;  probes</text>
  <text x="628" y="552" fill="#64748b" font-size="10">CPU   req: 2  lim: 4          memory  req: 8Gi  lim: 14Gi</text>
  <text x="628" y="568" fill="#64748b" font-size="10">readinessProbe  GET /health :8080  initialDelay: 600s  failureThreshold: 30</text>
  <text x="628" y="584" fill="#64748b" font-size="10">livenessProbe   GET /health :8080  initialDelay: 600s  failureThreshold: 5</text>
  <text x="628" y="600" fill="#374151" font-size="10">nodeSelector: role=gpu  ·  tolerates: nvidia.com/gpu:NoSchedule</text>

  <!-- HuggingFace cache note -->
  <rect x="594" y="630" width="436" height="42" rx="6" fill="#0f1e12" stroke="#166534" stroke-width="1"/>
  <text x="812" y="649" text-anchor="middle" fill="#374151" font-size="10">Model cache: /root/.cache/huggingface  on 100 GB gp3 root volume</text>
  <text x="812" y="665" text-anchor="middle" fill="#374151" font-size="10">HuggingFace download on first start  ·  ~14 GB  ·  cached on subsequent restarts</text>

  <!-- ══ CLIENT ════════════════════════════════════════════════════════════ -->
  <rect x="20" y="320" width="170" height="100" rx="8" fill="#1e1e2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="344" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">Client</text>
  <text x="105" y="362" text-anchor="middle" fill="#64748b" font-size="10">curl / app</text>
  <text x="105" y="380" text-anchor="middle" fill="#64748b" font-size="10">POST /v1/chat/completions</text>
  <text x="105" y="396" text-anchor="middle" fill="#64748b" font-size="10">Authorization: Bearer …</text>

  <!-- ══ REQUEST FLOW ARROWS ═══════════════════════════════════════════════ -->

  <!-- Arrow style: orange numbered circles + arrows -->
  <!-- Step labels -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- 1: Client → agentgateway -->
  <line x1="192" y1="362" x2="268" y2="432" stroke="#f97316" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="200" cy="378" r="9" fill="#f97316"/>
  <text x="200" y="382" text-anchor="middle" fill="white" font-size="9" font-weight="bold">1</text>
  <text x="172" y="414" fill="#f97316" font-size="9">HTTP :80</text>

  <!-- 2: agentgateway → llm-d (internal) -->
  <line x1="404" y1="392" x2="404" y2="378" stroke="#f97316" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="430" cy="386" r="9" fill="#f97316"/>
  <text x="430" y="390" text-anchor="middle" fill="white" font-size="9" font-weight="bold">2</text>
  <text x="442" y="388" fill="#f97316" font-size="9">route</text>

  <!-- 3: llm-d → KServe svc -->
  <line x1="538" y1="340" x2="590" y2="300" stroke="#f97316" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="556" cy="326" r="9" fill="#f97316"/>
  <text x="556" y="330" text-anchor="middle" fill="white" font-size="9" font-weight="bold">3</text>
  <text x="562" y="316" fill="#f97316" font-size="9">ClusterIP :80</text>

  <!-- 4: inside vLLM pod (tokenize → engine) -->
  <line x1="812" y1="298" x2="812" y2="306" stroke="#f97316" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="844" cy="300" r="9" fill="#f97316"/>
  <text x="844" y="304" text-anchor="middle" fill="white" font-size="9" font-weight="bold">4</text>
  <text x="856" y="302" fill="#f97316" font-size="9">tokenize + schedule</text>

  <!-- 5: engine → GPU -->
  <line x1="812" y1="408" x2="812" y2="428" stroke="#f97316" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="844" cy="418" r="9" fill="#f97316"/>
  <text x="844" y="422" text-anchor="middle" fill="white" font-size="9" font-weight="bold">5</text>
  <text x="856" y="420" fill="#f97316" font-size="9">CUDA forward pass</text>

  <!-- 6: tokens stream back (reverse, blue) -->
  <line x1="590" y1="272" x2="538" y2="310" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-blue)"/>
  <line x1="404" y1="300" x2="190" y2="360" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-blue)"/>
  <circle cx="360" cy="316" r="9" fill="#60a5fa"/>
  <text x="360" y="320" text-anchor="middle" fill="white" font-size="9" font-weight="bold">6</text>
  <text x="370" y="308" fill="#60a5fa" font-size="9">stream tokens</text>

  <!-- KServe controller watches arrow (dashed blue) -->
  <line x1="404" y1="222" x2="600" y2="192" stroke="#4f6ef7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead-blue)"/>
  <text x="480" y="200" fill="#4f6ef7" font-size="9">watches + reconciles</text>

  <!-- ══ LEGEND ═════════════════════════════════════════════════════════════ -->
  <rect x="254" y="700" width="820" height="48" rx="6" fill="#0f1117" stroke="#1e293b" stroke-width="1"/>
  <line x1="274" y1="722" x2="314" y2="722" stroke="#f97316" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="320" y="726" fill="#94a3b8" font-size="10">request path</text>
  <line x1="404" y1="722" x2="444" y2="722" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-blue)"/>
  <text x="450" y="726" fill="#94a3b8" font-size="10">response / token stream</text>
  <line x1="570" y1="722" x2="610" y2="722" stroke="#4f6ef7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead-blue)"/>
  <text x="616" y="726" fill="#94a3b8" font-size="10">control plane (async)</text>
  <rect x="720" y="714" width="12" height="12" rx="2" fill="#1e2d5a" stroke="#6366f1" stroke-width="1"/>
  <text x="738" y="725" fill="#94a3b8" font-size="10">system node component</text>
  <rect x="840" y="714" width="12" height="12" rx="2" fill="#1f3320" stroke="#16a34a" stroke-width="1"/>
  <text x="858" y="725" fill="#94a3b8" font-size="10">GPU node component</text>

  <!-- Step annotations below -->
  <text x="105" y="450" text-anchor="middle" fill="#475569" font-size="9">① Client → agentgateway :80</text>
  <text x="105" y="464" text-anchor="middle" fill="#475569" font-size="9">② agentgateway → llm-d</text>
  <text x="105" y="478" text-anchor="middle" fill="#475569" font-size="9">③ llm-d → KServe svc</text>
  <text x="105" y="492" text-anchor="middle" fill="#475569" font-size="9">④ Uvicorn → Engine (IPC)</text>
  <text x="105" y="506" text-anchor="middle" fill="#475569" font-size="9">⑤ Engine → GPU kernels</text>
  <text x="105" y="520" text-anchor="middle" fill="#475569" font-size="9">⑥ Tokens stream back</text>

</svg>
