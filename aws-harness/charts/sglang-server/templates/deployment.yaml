apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sglang-server.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sglang-server.labels" . | nindent 4 }}
  annotations:
    {{- include "sglang-server.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  # Abort a rollout that hasn't made progress within this many seconds.
  # 1800 (30 min) matches the startupProbe budget below — SGLang cold-start
  # (image pull + CUDA init + weight load from S3) is the slow path; if
  # we exceed 30 min something is genuinely wedged.
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds | default 1800 }}
  # GPU-friendly rolling update: terminate one old pod before creating
  # its replacement (no extra GPU needed during rollout). Brief per-pod
  # downtime during transitions. Users with spare GPU capacity can flip
  # to maxSurge=1/maxUnavailable=0 for zero-downtime updates.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge | default 0 }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "sglang-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sglang-server.labels" . | nindent 8 }}
      annotations:
        {{- include "sglang-server.annotations" . | nindent 8 }}
    spec:
      # Schedule onto the GPU node group provisioned by terraform/eks.tf.
      # gpu-pool selector (when set) pins to a specific pool — "l40s" for
      # the g6e group, "h200" for the p5e group. Omit for any-GPU-node
      # scheduling (single-pool cluster only).
      nodeSelector:
        role: gpu
        {{- if .Values.gpu.nodePool }}
        gpu-pool: {{ .Values.gpu.nodePool }}
        {{- end }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: sglang
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Use SGLang's launch_server CLI. Weights are at /model-cache
          # because that's where the Mountpoint S3 PV mounts; SGLang reads
          # safetensors + config from there.
          #
          # `--port` overrides SGLang's default 30000 so the harness's
          # canonical 8000 layout works for both vLLM and SGLang.
          command: ["python3", "-m", "sglang.launch_server"]
          args:
            - --model-path=/model-cache
            - --served-model-name={{ .Values.model.name }}
            - --host=0.0.0.0
            - --port={{ .Values.ports.http }}
            - --tp={{ .Values.gpu.tensorParallelSize }}
            # SGLang calls vLLM's --block-size "--page-size". When set,
            # pass it through explicitly — SGLang's own default resolves to
            # 1 (per-token) for GQA models, producing ~16x the event volume
            # and mismatching downstream subscribers. When unset (empty),
            # let SGLang pick and let kinference discover the value at runtime.
            {{- if .Values.model.blockSize }}
            - --page-size={{ .Values.model.blockSize }}
            {{- end }}
            # SGLang's Prometheus middleware is opt-in (default off).
            # Without this flag, GET /metrics returns 404 and metric-scraping
            # consumers would record empty bodies. Always-on for the harness.
            - --enable-metrics
            # SGLang's KV-events feature publishes on the Dynamo wire format
            # (same as vLLM).
            #
            # The `"publisher":"zmq"` discriminator is required: SGLang's
            # EventPublisherFactory dispatches on this key with default
            # "null" (a no-op publisher). Without it, SGLang errors at
            # scheduler init with:
            #   TypeError: EventPublisher.__init__() got an unexpected
            #   keyword argument 'endpoint'
            # because the kwargs are unpacked into NullEventPublisher which
            # accepts nothing.
            #
            # Verified against SGLang source at
            # python/sglang/srt/disaggregation/kv_events.py (registry +
            # ZmqEventPublisher.__init__).
            #
            # Topic format: `kv@<pod-ip>:<pub-port>@<model-name>`. The
            # $(POD_IP) and $(POD_PORT) placeholders are resolved by kubelet
            # at pod admission (BEFORE execve) against the env entries below;
            # this is K8s-native substitution, not shell expansion. SGLang's
            # CLI parses the already-resolved literal — same contract as
            # vLLM. Per-pod topic lets subscribers identify the publisher
            # straight from the topic string.
            #
            # Quoted to force YAML to treat the whole flag as a plain string
            # — the embedded `*` and `:` would otherwise risk being parsed
            # as YAML alias / mapping syntax in some parsers.
            - {{ printf "--kv-events-config={\"publisher\":\"zmq\",\"endpoint\":\"tcp://*:%d\",\"replay_endpoint\":\"tcp://*:%d\",\"topic\":\"kv@$(POD_IP):$(POD_PORT)@%s\"}" (int .Values.ports.kvEventsPub) (int .Values.ports.kvEventsReplay) .Values.model.name | quote }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Downward API + literal port — substituted into args at pod
            # creation (NOT shell time). Kubelet scans command/args for
            # $(VAR_NAME) and replaces with values from this same container's
            # env block before execve(). Referenced from --kv-events-config
            # above to build a per-pod ZMQ topic.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_PORT
              value: {{ .Values.ports.kvEventsPub | quote }}
            # Generic Hugging Face cache redirect — SGLang's image runs as
            # root with /root home, which may be read-only on some tags.
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/huggingface
            # Stream stdout lines as they're generated instead of waiting
            # for Python's default block-buffered fill. Matters during
            # cold-start where `kubectl logs -f` would otherwise show
            # nothing for minutes.
            - name: PYTHONUNBUFFERED
              value: "1"
            # Silence the HF tokenizers "forked process" warning that
            # otherwise floods stderr on every worker spawn.
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            # Telemetry opt-out. DO_NOT_TRACK is universally honored by
            # OSS ML projects including SGLang and Hugging Face.
            - name: DO_NOT_TRACK
              value: "1"
            # CUDA allocator hint: lets the allocator reuse reserved-but-
            # free blocks instead of fragmenting and OOMing on long-context
            # generation or on models where the engine's profile pass
            # under-budgets activations.
            #
            # Both env var names set defensively: PyTorch ≥ 2.5 supposedly
            # aliases PYTORCH_ALLOC_CONF → PYTORCH_CUDA_ALLOC_CONF, but
            # empirically the CUDA allocator only honors the CUDA-prefixed
            # name in current releases. The PyTorch OOM error message
            # itself explicitly suggests PYTORCH_CUDA_ALLOC_CONF.
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
          ports:
            - containerPort: {{ .Values.ports.http }}
              name: http
              protocol: TCP
            - containerPort: {{ .Values.ports.kvEventsPub }}
              name: kv-pub
              protocol: TCP
            - containerPort: {{ .Values.ports.kvEventsReplay }}
              name: kv-replay
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
              nvidia.com/gpu: {{ .Values.gpu.count | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
              nvidia.com/gpu: {{ .Values.gpu.count | quote }}
          volumeMounts:
            - name: weights
              mountPath: /model-cache
              readOnly: true
          # SGLang's health endpoint is /health (same as vLLM); readiness
          # check via /v1/models which only returns 200 once the model is
          # fully loaded.
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      # Shared PVC: Mountpoint S3 CSI is ReadOnlyMany so every replica
      # mounts the same prefix without contention. (Deployment doesn't
      # support volumeClaimTemplates — and we don't want per-pod PVCs
      # for read-only shared weights anyway.)
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: {{ include "sglang-server.name" . }}-weights
            readOnly: true
