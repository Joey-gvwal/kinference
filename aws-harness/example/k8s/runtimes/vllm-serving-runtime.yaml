# vLLM ServingRuntime for KServe
# Defines how KServe should launch vLLM as the inference backend.
# Apply once after KServe is installed; InferenceService objects reference it by name.
#
# Docs: https://kserve.github.io/website/latest/modelserving/v1beta1/llm/vllm/
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime
  namespace: default
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"

  supportedModelFormats:
    - name: vllm
      version: "1"
      autoSelect: true
    # Also handles Hugging Face models (safetensors / pytorch_model.bin)
    - name: huggingface
      version: "1"
      autoSelect: true

  protocolVersions:
    - v2       # Open Inference Protocol (KServe v2)

  containers:
    - name: kserve-container
      image: vllm/vllm-openai:v0.6.4
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        # MODEL_NAME is injected by the InferenceService env block below.
        # Standard Kubernetes $(VAR) substitution resolves this before container start.
        - "--model"
        - "$(MODEL_NAME)"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        # ── Memory and performance ───────────────────────────────────────
        - "--gpu-memory-utilization"
        - "0.90"                   # Reserve 10% for CUDA overhead
        - "--max-model-len"
        - "8192"                   # Reduce if OOM; increase for longer contexts
        - "--dtype"
        - "auto"                   # auto = bfloat16 on A10G
        # ── Quantization (recommended for 13B+ on 24 GB VRAM) ───────────
        # Uncomment one of the following for larger models:
        # - "--quantization"
        # - "awq"                  # AWQ int4: ~14 GB for 13B, ~17 GB for 30B
        # - "--quantization"
        # - "gptq"                 # GPTQ int4: similar compression to AWQ
        # ── OpenAI-compatible API ────────────────────────────────────────
        - "--served-model-name"
        - "mistral-7b"             # Matches the InferenceService name for easy routing
      env:
        # Hugging Face token — needed for gated models (Llama, Gemma, etc.)
        # Create a Kubernetes secret and reference it:
        # - name: HUGGING_FACE_HUB_TOKEN
        #   valueFrom:
        #     secretKeyRef:
        #       name: hf-token
        #       key: token
      ports:
        - containerPort: 8080
          protocol: TCP
          name: http             # HTTP/1.1 — h2c causes agentgateway to attempt HTTP/2 which vLLM rejects
      resources:
        requests:
          cpu: "2"
          memory: "8Gi"          # CPU-side RAM only — model weights live on GPU VRAM
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "14Gi"         # Fits within g6/g5.xlarge allocatable (~15Gi)
          nvidia.com/gpu: "1"
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 600   # 10 min: download (5-10 min) + shard loading (2-3 min)
        periodSeconds: 10
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 600   # Must match readiness — liveness killing pod during load
        periodSeconds: 20
        failureThreshold: 5

  # Schedule vLLM pods only on GPU nodes
  nodeSelector:
    role: gpu

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
