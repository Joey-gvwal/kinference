{{- if .Values.extension.enabled }}
# The Extension object that puts kinference in a gateway's request path.
#
# kinference NAMES this object but never creates it at runtime. Every
# BackendBinding the router publishes (`[policy] backend_bindings = true`)
# lists the extension named by `[policy] backend_binding_extension` in the
# config — `chat-picker` — and the gateway prepends it to the filter chain of
# every rule routing to the pool. The binding says WHICH backends the pool
# spans; this extension is what asks kinference, per request, which one the
# request goes to. Rename it in both places or in neither: a binding naming an
# Extension that does not exist programs a route whose filter chain cannot be
# built.
#
# Opt-in (extension.enabled) because the Extension kind is the GATEWAY's CRD
# (`gateway.linkerd.io/v1alpha1`, shipped in its Helm chart) — a cluster
# without the gateway installed cannot take this object.
#
# Namespace matters twice over: the gateway resolves the reference in the
# BINDING's namespace, and a binding lives in its pool's namespace — so this
# has to sit alongside the pools (`[policy] namespace` in the config).
apiVersion: gateway.linkerd.io/v1alpha1
kind: Extension
metadata:
  name: {{ .Values.extension.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kinference.labels" . | nindent 4 }}
spec:
  class: kinference_selector
  config:
    # Past one replica this needs a per-pod DNS name or shared picker state;
    # see the scaling checklist in templates/deployment.yaml.
    service: {{ include "kinference.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.grpcPort }}
    {{- with .Values.extension.tenantHeader }}
    # Request header carrying the tenant id — pairs with
    # `[metrics] tenant_labels` in the config: without a header to read from,
    # every request is attributed to tenant="default".
    tenantHeader: {{ . }}
    {{- end }}
    {{- with .Values.extension.qos }}
    # Interactive (default) | Batch | Deferrable.
    qos: {{ . }}
    {{- end }}
{{- end }}
