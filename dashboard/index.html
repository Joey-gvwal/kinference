<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kinference — Live Dashboard</title>
  <link rel="icon" href="/assets/buoyant-mark.svg" />
  <style>
    html, body { min-height: 100vh; }
    body { overflow-x: hidden; background: var(--bg-canvas); }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    * { box-sizing: border-box; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--navy-a16); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--navy-a24); background-clip: padding-box; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.55; transform: scale(0.85); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slide-in-right {
      from { transform: translateX(100%); }
      to   { transform: translateX(0); }
    }

    /* svg crispness */
    svg { shape-rendering: geometricPrecision; }

    /* table doesn't get its default border */
    table { border-collapse: collapse; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
