# Gemma 4 worker set.
#
# `profile` must name a [[profile]] in configmap.yaml — there is no gemma
# profile there yet, so add one before applying this or the set is refused with
# Accepted=False/UnknownProfile and nothing routes to it.
apiVersion: kinference.buoyant.io/v1alpha1
kind: InferenceWorkerSet
metadata:
  name: gemma-4-12b
  namespace: default
spec:
  profile: default
  kvBlockSize: 64

  serviceRef:
    name: gemma-4-12b-vllm
    port: http
  kvEvents:
    port: kv-pub

  models:
    - {name: google/gemma-4-12B-it, aliases: [gemma-4]}
