apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inference
spec:
  parentRefs:
    - name: kinference
      sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/chat/completions
    backendRefs:
      - kind: InferencePool
        group: kinference.buoyant.io
        name: inference-local
